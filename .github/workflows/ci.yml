name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Vet, Test & Budget Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Repository Hygiene, License & Service Installer Check
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          if find . -path ./web/admin/node_modules -prune -o -name "*.properties" -print | grep -q .; then
            echo "FAIL: forbidden .properties file detected" >&2
            exit 1
          fi
          if grep -RInE '\b(TODO|FIXME)\b' cmd internal pkg web/admin/src themes plugins; then
            echo "FAIL: unresolved TODO/FIXME marker detected in source" >&2
            exit 1
          fi
          if grep -RInE -i '(b3log|latke|hacpai|ld246|fishpi|vditor|jquery|mdui|bulma|sweetalert|optiondocuments|syncgithub)' cmd internal pkg web/admin/src themes plugins; then
            echo "FAIL: banned legacy coupling identifier detected in source" >&2
            exit 1
          fi
          sh -n scripts/install-service.sh
          sh -n scripts/install-service-linux.sh
          sh -n scripts/install-service-macos.sh
          sh -n deploy/openrc/volo.initd
          bash -n scripts/install-service.sh scripts/verify-binary-budget.sh
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoLogo -NoProfile -NonInteractive -Command '
              $hasErr = $false
              foreach ($f in @("scripts/install-service.ps1", "scripts/install-service-windows.ps1")) {
                $tokens = $null
                $errors = $null
                $full = (Resolve-Path $f).Path
                [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
                if ($errors.Count -gt 0) {
                  foreach ($e in $errors) { [Console]::Error.WriteLine("${f}: $($e.ToString())") }
                  $hasErr = $true
                }
              }
              if ($hasErr) { exit 1 }
            '
          fi
          sh scripts/install-service.sh install --dry-run --init systemd --unix-socket /run/volo/volo.sock --socket-group www-data >/dev/null
          bash scripts/install-service.sh --dry-run --user volo --group volo --unix-socket /run/volo/volo.sock --socket-group www-data --socket-mode 0660 --bin-dir /opt/volo/bin --data-dir /srv/volo/data >/dev/null
          sh scripts/install-service.sh upgrade --dry-run --init systemd >/dev/null
          bash scripts/install-service-linux.sh install --dry-run --init systemd --listen-socket /run/volo/volo.sock --socket-group www-data >/dev/null
          bash scripts/install-service-macos.sh install --dry-run >/dev/null

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/admin/package-lock.json

      - name: Build Admin Console SPA & Verify Gzip Budget (< 300 KB)
        working-directory: web/admin
        run: |
          npm ci --no-audit --no-fund
          rm -rf ../../internal/adminui/dist && mkdir -p ../../internal/adminui/dist
          npm run build
          PRE_GZ=$(find ../../internal/adminui/dist -type f -name "*.gz" -exec cat {} + | wc -c | tr -d ' ')
          RAW_GZ=$(find ../../internal/adminui/dist -type f ! -name "*.gz" ! -name "*.map" -exec gzip -9 -c {} + | wc -c | tr -d ' ')
          GZIP_BYTES=$((PRE_GZ + RAW_GZ))
          echo "Admin SPA total gzipped size: ${GZIP_BYTES} bytes"
          if [ "${GZIP_BYTES}" -ge 307200 ]; then
            echo "Admin SPA exceeds 300 KB Gzip budget (${GZIP_BYTES} bytes)" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile & Static Analysis (go build & go vet)
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
        run: |
          go build ./...
          go vet ./...

      - name: Run Unit & Integration Suite (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
        run: go test -count=1 ./...

      - name: Run Race Detector Suite
        env:
          CGO_ENABLED: "1"
          GOEXPERIMENT: "nojsonv2"
        run: go test -race -count=1 ./...

      - name: Run Benchmark Smoke Gate
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
        run: go test -run=^$ -bench=. -benchtime=50ms ./internal/render ./internal/visibility ./internal/db/sqlx ./internal/server

      - name: Verify Cross-Compilation Matrix (6 Targets, CGO_ENABLED=0, < 21 MiB Each)
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
          VOLO_BUDGET_BIN_MB: ${{ vars.VOLO_BUDGET_BIN_MB }}
        run: |
          BUDGET_BIN_MB="${VOLO_BUDGET_BIN_MB:-21}"
          MAX_BIN_BYTES=$((BUDGET_BIN_MB * 1024 * 1024))
          mkdir -p /tmp/volo-cross
          GC_ALL="all=-l"
          LD_ALL="-s -w -funcalign=8 -buildid="
          GOOS=linux   GOARCH=amd64 go build -buildvcs=false -trimpath -gcflags="${GC_ALL}" -ldflags="${LD_ALL}" -o /tmp/volo-cross/volo-linux-amd64       ./cmd/volo
          GOOS=linux   GOARCH=arm64 go build -buildvcs=false -trimpath -gcflags="${GC_ALL}" -ldflags="${LD_ALL}" -o /tmp/volo-cross/volo-linux-arm64       ./cmd/volo
          GOOS=darwin  GOARCH=amd64 go build -buildvcs=false -trimpath -gcflags="${GC_ALL}" -ldflags="${LD_ALL}" -o /tmp/volo-cross/volo-darwin-amd64      ./cmd/volo
          GOOS=darwin  GOARCH=arm64 go build -buildvcs=false -trimpath -gcflags="${GC_ALL}" -ldflags="${LD_ALL}" -o /tmp/volo-cross/volo-darwin-arm64      ./cmd/volo
          GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -gcflags="${GC_ALL}" -ldflags="${LD_ALL}" -o /tmp/volo-cross/volo-windows-amd64.exe ./cmd/volo
          GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -gcflags="${GC_ALL}" -ldflags="${LD_ALL}" -o /tmp/volo-cross/volo-windows-arm64.exe ./cmd/volo
          ls -lh /tmp/volo-cross
          for bin in /tmp/volo-cross/*; do
            SZ=$(wc -c < "$bin" | tr -d ' ')
            if [ "$SZ" -ge "$MAX_BIN_BYTES" ]; then
              echo "FAIL: $bin ($SZ bytes) exceeds ${BUDGET_BIN_MB}.00 MiB budget (${MAX_BIN_BYTES} bytes)" >&2
              exit 1
            fi
          done

      - name: Enforce Binary Size (< 21 MiB), Static Linkage & Idle RSS (< 35 MiB)
        env:
          GOEXPERIMENT: "nojsonv2"
          VOLO_BUDGET_BIN_MB: ${{ vars.VOLO_BUDGET_BIN_MB }}
          VOLO_BUDGET_RSS_MB: ${{ vars.VOLO_BUDGET_RSS_MB }}
        run: bash scripts/verify-binary-budget.sh
