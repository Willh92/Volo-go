name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulncheck:
    name: Go govulncheck & Frontend Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/admin/package-lock.json

      - name: Audit Admin SPA Production Dependencies & Build Dist
        working-directory: web/admin
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          rm -rf ../../internal/adminui/dist && mkdir -p ../../internal/adminui/dist
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  codeql:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare Embedded Dist for Go Embed Compilation
        if: matrix.language == 'go'
        run: |
          mkdir -p internal/adminui/dist
          if [ ! -f internal/adminui/dist/index.html ] && [ ! -f internal/adminui/dist/index.html.gz ]; then
            printf '<!doctype html><title>volo</title>\n' > internal/adminui/dist/index.html
          fi

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        env:
          GOEXPERIMENT: "nojsonv2"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      - name: Summarize CodeQL Findings
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, os
          rows = []
          for path in glob.glob("sarif-results/*.sarif"):
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              for run in data.get("runs", []):
                  for res in run.get("results", []):
                      if res.get("suppressions"):
                          continue
                      loc = (res.get("locations") or [{}])[0].get("physicalLocation", {})
                      uri = loc.get("artifactLocation", {}).get("uri", "?")
                      line = loc.get("region", {}).get("startLine", 0)
                      msg = res.get("message", {}).get("text", "").splitlines()[0][:160]
                      rows.append((res.get("ruleId", "?"), res.get("level", "warning"), f"{uri}:{line}", msg))
          print(f"CodeQL findings: {len(rows)}")
          for r in rows:
              print(" | ".join(r))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"### CodeQL `${{ matrix.language }}` findings: {len(rows)}\n\n")
              if rows:
                  out.write("| Rule | Level | Location | Message |\n|---|---|---|---|\n")
                  for r in rows:
                      out.write("| " + " | ".join(x.replace("|", "\\|") for x in r) + " |\n")
          PY

      - name: Upload CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/*.sarif
          if-no-files-found: ignore
          retention-days: 14
