name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0 or v1.0.0-preview.1)"
        required: true
        type: string
      prerelease:
        description: "Force mark release as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build Embedded Admin Console
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/admin/package-lock.json

      - name: Build Admin SPA & Precompress Embedded Assets
        working-directory: web/admin
        run: |
          npm ci --no-audit --no-fund
          rm -rf ../../internal/adminui/dist && mkdir -p ../../internal/adminui/dist
          npm run build

      - name: Minify Bundled Plugins for Release Archives
        run: |
          rm -rf dist-minified-plugins && mkdir -p dist-minified-plugins
          node .github/scripts/minify-plugin-assets.mjs \
            --dir plugins/sensitive-words \
            --out-dir dist-minified-plugins/sensitive-words
          node -e 'const fs=require("fs");fs.writeFileSync("dist-minified-plugins/catalog.json",JSON.stringify(JSON.parse(fs.readFileSync("plugins/catalog.json","utf8"))));'

      - name: Pack Built Embedded Assets
        run: |
          tar -cf embedded-assets.tar \
            internal/adminui/dist \
            internal/i18n/builtin_gz \
            internal/theme/builtin/volo-studio/assets_gz \
            internal/theme/builtin/volo-studio/templates_gz \
            internal/theme/builtin/volo-studio/theme.json.gz \
            internal/theme/builtin/volo-studio/preview.svg.gz \
            dist-minified-plugins

      - name: Upload Built Admin Dist
        uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: embedded-assets.tar

  verify:
    name: Verify Release Metadata, Vet & Tests
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      is_default_or_tag: ${{ steps.meta.outputs.is_default_or_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Release Version & Prerelease Metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          FULL_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            RAW_VER="${INPUT_VERSION#refs/tags/}"
            case "${RAW_VER}" in
              v*) VER="${RAW_VER}" ;;
              *)  VER="v${RAW_VER}" ;;
            esac
          else
            VER="${REF_NAME}"
          fi

          if ! printf '%s\n' "${VER}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid semantic version tag: '${VER}' (expected e.g. v1.0.0 or v1.0.0-preview.1)" >&2
            exit 1
          fi

          IS_PRE="false"
          case "${VER}" in
            *-*) IS_PRE="true" ;;
          esac
          if [ "${INPUT_PRERELEASE}" = "true" ]; then
            IS_PRE="true"
          fi

          IS_DEF_OR_TAG="false"
          case "${FULL_REF}" in
            refs/tags/v*) IS_DEF_OR_TAG="true" ;;
            "refs/heads/${DEFAULT_BRANCH}") IS_DEF_OR_TAG="true" ;;
          esac

          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRE}" >> "${GITHUB_OUTPUT}"
          echo "is_default_or_tag=${IS_DEF_OR_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release: version=${VER}, is_prerelease=${IS_PRE}, is_default_or_tag=${IS_DEF_OR_TAG}"

      - name: Download Built Admin Dist
        uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: .

      - name: Extract Built Embedded Assets
        run: |
          rm -rf internal/adminui/dist && mkdir -p internal/adminui/dist
          tar -xf embedded-assets.tar && rm -rf embedded-assets.tar dist-minified-plugins

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Release Gate (go vet & go test with GOEXPERIMENT=nojsonv2)
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
        run: |
          go vet ./...
          go test -count=1 ./...

  cross-binaries:
    name: Build Static Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [verify, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Built Admin Dist
        uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: .

      - name: Extract Built Embedded Assets
        run: |
          rm -rf internal/adminui/dist dist-minified-plugins && mkdir -p internal/adminui/dist
          tar -xf embedded-assets.tar && rm -f embedded-assets.tar

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Package Pure-Go Release Bundle
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.verify.outputs.version }}
          VOLO_BUDGET_BIN_MB: ${{ vars.VOLO_BUDGET_BIN_MB }}
        run: |
          BUDGET_BIN_MB="${VOLO_BUDGET_BIN_MB:-22}"
          MAX_BIN_BYTES=$((BUDGET_BIN_MB * 1024 * 1024))
          STAGE="volo-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${STAGE}/scripts"
          go build -buildvcs=false -trimpath \
            -gcflags="all=-l" \
            -gcflags="github.com/Willh92/Volo-go/internal/render/...=-l=4" \
            -gcflags="github.com/Willh92/Volo-go/internal/security/...=-l=4" \
            -gcflags="github.com/Willh92/Volo-go/pkg/plugin/...=-l=4" \
            -ldflags="-s -w -funcalign=8 -buildid= -X main.Version=${VERSION}" \
            -o "dist/${STAGE}/volo${{ matrix.ext }}" \
            ./cmd/volo

          BIN_BYTES=$(wc -c < "dist/${STAGE}/volo${{ matrix.ext }}" | tr -d ' ')
          echo "Built ${STAGE}/volo${{ matrix.ext }}: ${BIN_BYTES} bytes (limit < ${MAX_BIN_BYTES} bytes / ${BUDGET_BIN_MB}.00 MiB)"
          if [ "${BIN_BYTES}" -ge "${MAX_BIN_BYTES}" ]; then
            echo "Binary exceeds ${BUDGET_BIN_MB}.00 MiB budget (${BIN_BYTES} >= ${MAX_BIN_BYTES} bytes)" >&2
            exit 1
          fi

          cp .env.example README.md README.zh-CN.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md CHANGELOG.zh-CN.md docker-compose.yml "dist/${STAGE}/"
          # Ship only the service installers relevant to the target OS. The install-service.sh
          # dispatcher is self-contained (it never sources the per-OS wrappers), and the
          # install-service-<os> files are thin compatibility wrappers around the dispatcher.
          case "${GOOS}" in
            linux)   cp scripts/install-service.sh scripts/install-service-linux.sh "dist/${STAGE}/scripts/" ;;
            darwin)  cp scripts/install-service.sh scripts/install-service-macos.sh "dist/${STAGE}/scripts/" ;;
            windows) cp scripts/install-service.ps1 scripts/install-service-windows.ps1 "dist/${STAGE}/scripts/" ;;
            *) echo "Unsupported GOOS for packaging: ${GOOS}" >&2; exit 1 ;;
          esac
          cp -r deploy "dist/${STAGE}/deploy"
          cp -r docs "dist/${STAGE}/docs"
          cp -r locales "dist/${STAGE}/locales"
          cp -r plugins "dist/${STAGE}/plugins"
          # Keep main OS/arch core bundles ~8 MB slim; standalone-release plugins (kanbanniang)
          # are version-deduplicated into their own `plugin-kanbanniang-v<version>` GitHub Release.
          rm -rf "dist/${STAGE}/plugins/kanbanniang"
          if [ -d dist-minified-plugins ]; then
            cp -rf dist-minified-plugins/. "dist/${STAGE}/plugins/"
            rm -rf dist-minified-plugins
          fi
          cp -r themes "dist/${STAGE}/themes"

          if [ "${GOOS}" = "windows" ]; then
            python3 -c 'import sys; p, v = sys.argv[1], sys.argv[2]; lines = ["@echo off", "chcp 65001 >nul", "cd /d \"%~dp0\"", "echo ==========================================================", f"echo   Volo-go {v} Local Server Starting on 127.0.0.1:8080", "echo ==========================================================", "start \"\" \"http://127.0.0.1:8080\"", "\"%~dp0volo.exe\" serve --listen-addr 127.0.0.1:8080", "pause", ""]; open(p, "wb").write("\r\n".join(lines).encode("ascii"))' "dist/${STAGE}/start-volo.bat" "${VERSION}"
          fi

          # Reproducible archives: normalized permissions and mtimes pinned to the tag commit time.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct 2>/dev/null || true)"
          case "${SOURCE_DATE_EPOCH}" in
            ''|*[!0-9]*) SOURCE_DATE_EPOCH="$(date -u -d 2026-01-01T00:00:00Z +%s)" ;;
          esac
          export SOURCE_DATE_EPOCH
          chmod -R u+rwX,go+rX,go-w "dist/${STAGE}"
          chmod 0755 "dist/${STAGE}/volo${{ matrix.ext }}"
          find "dist/${STAGE}/scripts" -type f -name '*.sh' -exec chmod 0755 {} +
          find "dist/${STAGE}" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +

          cd dist
          STABLE="volo-${GOOS}-${GOARCH}"
          HAVE_7Z=0
          if command -v 7z >/dev/null 2>&1; then HAVE_7Z=1; fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            rm -f "${STAGE}.zip"
            if [ "${HAVE_7Z}" = "1" ]; then
              7z a -tzip -mx=9 -mfb=258 -mpass=15 -bd -bso0 -bsp0 "${STAGE}.zip" "${STAGE}"
            else
              echo "7z not found; falling back to zip -9" >&2
              find "${STAGE}" -print | LC_ALL=C sort | zip -9qX "${STAGE}.zip" -@
            fi
            cp "${STAGE}.zip" "${STABLE}.zip"
          else
            rm -f "${STAGE}.tar" "${STAGE}.tar.gz"
            tar --sort=name --format=gnu --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" -cf "${STAGE}.tar" "${STAGE}"
            touch -d "@${SOURCE_DATE_EPOCH}" "${STAGE}.tar"
            if [ "${HAVE_7Z}" = "1" ]; then
              7z a -tgzip -mx=9 -mfb=258 -mpass=15 -bd -bso0 -bsp0 "${STAGE}.tar.gz" "${STAGE}.tar"
            else
              echo "7z not found; falling back to gzip -9n" >&2
              gzip -9n -c "${STAGE}.tar" > "${STAGE}.tar.gz"
            fi
            rm -f "${STAGE}.tar"
            cp "${STAGE}.tar.gz" "${STABLE}.tar.gz"
          fi
          rm -rf "${STAGE}"
          echo "Release archives (bytes):"
          for f in "${STAGE}".* "${STABLE}".*; do
            printf '  %-48s %12s bytes (%s)\n' "${f}" "$(wc -c < "${f}" | tr -d ' ')" "$(du -h "${f}" | cut -f1)"
          done

      - name: Upload Target Archive
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  ensure-kanbanniang-release:
    name: Ensure Version-Deduplicated Kanbanniang Plugin Release
    needs: [verify]
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-kanbanniang-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Sparse checkout plugin metadata & packager
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/package-plugin.py
            plugins/catalog.json
            plugins/kanbanniang/manifest.json
            plugins/kanbanniang/main.js
          sparse-checkout-cone-mode: false

      - name: Check If Current Kanbanniang Version Release Already Exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          META_OUT="$(python3 .github/scripts/package-plugin.py --plugin kanbanniang --print-meta)"
          echo "${META_OUT}"
          echo "${META_OUT}" >> "${GITHUB_OUTPUT}"

          TAG="$(printf '%s\n' "${META_OUT}" | sed -n 's/^release_tag=//p')"
          ASSET="$(printf '%s\n' "${META_OUT}" | sed -n 's/^release_asset=//p')"

          if gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "${ASSET}"; then
            echo "should_package=false" >> "${GITHUB_OUTPUT}"
            echo "Skip packaging: ${TAG} (${ASSET}) is already published; avoiding duplicate build & upload."
          else
            echo "should_package=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${TAG} not found yet; packaging standalone Kanbanniang ZIP..."
          fi

      - name: Reset sparse-checkout workspace (Only When Version Is Unpublished)
        if: steps.check.outputs.should_package == 'true'
        run: find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout full repository (Only When Version Is Unpublished)
        if: steps.check.outputs.should_package == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 (Only When Version Is Unpublished)
        if: steps.check.outputs.should_package == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/admin/package-lock.json

      - name: Install Minifier Toolchain Dependencies (Only When Version Is Unpublished)
        if: steps.check.outputs.should_package == 'true'
        run: npm ci --prefix web/admin --no-audit --no-fund

      - name: Build Deterministic Kanbanniang ZIP Archive (Only When Version Is Unpublished)
        if: steps.check.outputs.should_package == 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- plugins/kanbanniang 2>/dev/null || true)"
          case "${SOURCE_DATE_EPOCH}" in
            ''|*[!0-9]*) SOURCE_DATE_EPOCH="$(date -u -d 2026-01-01T00:00:00Z +%s)" ;;
          esac
          export SOURCE_DATE_EPOCH
          python3 .github/scripts/package-plugin.py \
            --plugin kanbanniang \
            --output-dir plugin-dist \
            --repo "${REPO}"

      - name: Publish Standalone Kanbanniang Plugin Release (make_latest=false)
        if: steps.check.outputs.should_package == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: "Plugin: Kanbanniang v${{ steps.check.outputs.version }}"
          tag_name: ${{ steps.check.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: "false"
          body_path: plugin-dist/plugin-release-notes.md
          generate_release_notes: false
          files: |
            plugin-dist/${{ steps.check.outputs.release_asset }}
            plugin-dist/${{ steps.check.outputs.release_asset_alias }}
            plugin-dist/SHA256SUMS.txt

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: [verify, cross-binaries, ensure-kanbanniang-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (with tags for release notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Forward Release Metadata & Generate Concise Release Notes
        id: meta
        env:
          VER: ${{ needs.verify.outputs.version }}
          IS_PRE: ${{ needs.verify.outputs.is_prerelease }}
          REPO: ${{ github.repository }}
        run: |
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRE}" >> "${GITHUB_OUTPUT}"
          python3 .github/scripts/generate-release-notes.py \
            --version "${VER}" \
            --repo "${REPO}" \
            --output release-notes.md
          cat release-notes.md

      - name: Download All Target Archives
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Volo-go ${{ steps.meta.outputs.version }}
          tag_name: ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          body_path: release-notes.md
          generate_release_notes: false
          files: release-assets/*

  publish-ghcr:
    name: Build & Push Multi-Arch GHCR Container
    needs: [verify, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.is_prerelease != 'true' }}
            type=semver,pattern={{major}},value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.is_prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_prerelease != 'true' && needs.verify.outputs.is_default_or_tag == 'true' }}

      - name: Build and Push Multi-Arch Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
