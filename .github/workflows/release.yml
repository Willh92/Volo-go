name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-frontend:
    name: Build Embedded Admin Console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/admin/package-lock.json

      - name: Build Admin SPA
        working-directory: web/admin
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload Built Admin Dist
        uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: internal/adminui/dist

  cross-binaries:
    name: Build Static Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Built Admin Dist
        uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: internal/adminui/dist

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Package Pure-Go Release Bundle
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: "nojsonv2"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          VOLO_BUDGET_BIN_MB: ${{ vars.VOLO_BUDGET_BIN_MB }}
        run: |
          BUDGET_BIN_MB="${VOLO_BUDGET_BIN_MB:-21}"
          MAX_BIN_BYTES=$((BUDGET_BIN_MB * 1024 * 1024))
          STAGE="volo-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${STAGE}/scripts"
          go build -buildvcs=false -trimpath \
            -gcflags="all=-l" \
            -ldflags="-s -w -funcalign=8 -X main.Version=${VERSION}" \
            -o "dist/${STAGE}/volo${{ matrix.ext }}" \
            ./cmd/volo

          BIN_BYTES=$(wc -c < "dist/${STAGE}/volo${{ matrix.ext }}" | tr -d ' ')
          if [ "${BIN_BYTES}" -ge "${MAX_BIN_BYTES}" ]; then
            echo "Binary exceeds ${BUDGET_BIN_MB} MiB budget (${BIN_BYTES} >= ${MAX_BIN_BYTES} bytes)" >&2
            exit 1
          fi

          cp .env.example README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md docker-compose.yml "dist/${STAGE}/"
          cp scripts/install-service.sh scripts/install-service.ps1 scripts/install-service-linux.sh scripts/install-service-macos.sh scripts/install-service-windows.ps1 "dist/${STAGE}/scripts/"
          chmod +x "dist/${STAGE}/scripts/"*.sh
          cp -r deploy "dist/${STAGE}/deploy"
          cp -r docs "dist/${STAGE}/docs"
          cp -r locales "dist/${STAGE}/locales"
          cp -r plugins "dist/${STAGE}/plugins"
          cp -r themes "dist/${STAGE}/themes"

          if [ "${GOOS}" = "windows" ]; then
            python3 -c 'import sys; p, v = sys.argv[1], sys.argv[2]; lines = ["@echo off", "chcp 65001 >nul", "cd /d \"%~dp0\"", "echo ==========================================================", f"echo   Volo-go {v} Local Server Starting on 127.0.0.1:8080", "echo ==========================================================", "start \"\" \"http://127.0.0.1:8080\"", "\"%~dp0volo.exe\" serve --listen-addr 127.0.0.1:8080", "pause", ""]; open(p, "wb").write("\r\n".join(lines).encode("ascii"))' "dist/${STAGE}/start-volo.bat" "${VERSION}"
          fi

          cd dist
          STABLE="volo-${GOOS}-${GOARCH}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            rm -f "${STAGE}.zip"
            zip -rq "${STAGE}.zip" "${STAGE}"
            cp "${STAGE}.zip" "${STABLE}.zip"
          else
            tar -czf "${STAGE}.tar.gz" "${STAGE}"
            cp "${STAGE}.tar.gz" "${STABLE}.tar.gz"
          fi
          rm -rf "${STAGE}"

      - name: Upload Target Archive
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: cross-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download All Target Archives
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*

  publish-ghcr:
    name: Build & Push Multi-Arch GHCR Container
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
