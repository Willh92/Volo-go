# ==============================================================================
# Volo-go Apache httpd 2.4+ VirtualHost Reverse Proxy Configuration
# Required modules: a2enmod proxy proxy_http headers ssl rewrite http2
# Matching .env settings:
#   VOLO_LISTEN_ADDR=127.0.0.1:8080
#   VOLO_PUBLIC_URL=https://blog.example.com
#   VOLO_TRUSTED_PROXIES=127.0.0.1/32,::1/128
# ==============================================================================

<VirtualHost *:80>
    ServerName blog.example.com
    Redirect permanent / https://blog.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName blog.example.com
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/blog.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/blog.example.com/privkey.pem

    LimitRequestBody 134217728

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"

    ProxyPass        / http://127.0.0.1:8080/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
