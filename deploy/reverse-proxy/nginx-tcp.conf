# ==============================================================================
# Volo-go Nginx Reverse Proxy Configuration (TCP Loopback Mode)
# Matching .env settings:
#   VOLO_LISTEN_ADDR=127.0.0.1:8080
#   VOLO_PUBLIC_URL=https://blog.example.com
#   VOLO_TRUSTED_PROXIES=127.0.0.1/32,::1/128
# ==============================================================================

upstream volo_backend_tcp {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:VoloTLS:10m;

    # Allow image, podcast MP3/M4A, and backup ZIP uploads
    client_max_body_size 128m;

    # Security headers (Volo-go already sets strict CSP / Cache-Control on private routes)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Zero-copy HTTP Range passthrough for Podcast audio & uploaded media
    location ^~ /uploads/ {
        proxy_pass              http://volo_backend_tcp;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Range             $http_range;
        proxy_set_header        If-Range          $http_if_range;
        proxy_buffering         off;
    }

    location / {
        proxy_pass              http://volo_backend_tcp;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
    }
}
