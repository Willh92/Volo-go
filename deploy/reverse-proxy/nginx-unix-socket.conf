# ==============================================================================
# Volo-go Nginx Reverse Proxy Configuration (Zero-TCP Unix Domain Socket Mode)
#
# 1. Install service sharing group with Nginx (e.g. www-data on Debian/Ubuntu, nginx on RHEL):
#      sudo ./scripts/install-service.sh install \
#        --group www-data \
#        --unix-socket /run/volo/volo.sock \
#        --socket-mode 0660 \
#        --public-url https://blog.example.com
#
# 2. Matching .env settings:
#      VOLO_LISTEN_SOCKET=/run/volo/volo.sock
#      VOLO_LISTEN_SOCKET_MODE=0660
#      VOLO_PUBLIC_URL=https://blog.example.com
#      VOLO_TRUSTED_PROXIES=127.0.0.1/32,::1/128,unix
# ==============================================================================

upstream volo_backend_uds {
    server unix:/run/volo/volo.sock;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 128m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;

    location ^~ /uploads/ {
        proxy_pass              http://volo_backend_uds;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Range             $http_range;
        proxy_set_header        If-Range          $http_if_range;
        proxy_buffering         off;
    }

    location / {
        proxy_pass              http://volo_backend_uds;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }
}
