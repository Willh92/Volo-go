# ==============================================================================
# Volo-go Traefik v3 Dynamic Configuration
# Matching .env settings:
#   VOLO_PUBLIC_URL=https://blog.example.com
#   VOLO_TRUSTED_PROXIES=127.0.0.1/32,::1/128,172.16.0.0/12
# ==============================================================================

http:
  routers:
    volo-router:
      rule: "Host(`blog.example.com`)"
      entryPoints:
        - websecure
      middlewares:
        - volo-security-headers
        - volo-body-limit
      service: volo-service
      tls:
        certResolver: letsencrypt

  middlewares:
    volo-security-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
    volo-body-limit:
      buffering:
        maxRequestBodyBytes: 134217728 # 128 MiB

  services:
    volo-service:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: /healthz
          interval: 30s
          timeout: 5s
        servers:
          - url: "http://127.0.0.1:8080"
