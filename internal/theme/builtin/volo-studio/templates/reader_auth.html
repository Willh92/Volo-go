{{define "content"}}
<div class="reader-auth-grid {{if not .Reading.AllowReaderRegister}}reader-auth-grid--single{{end}}">
  <section class="studio-article reader-auth-card">
    <h2 class="reader-auth-card__title">{{t .Locale "nav.login"}}</h2>
    <form id="volo-reader-login-form" class="reader-auth-form">
      <div class="reader-auth-field">
        <label class="reader-auth-label" for="volo-reader-ident">{{t .Locale "reader.ident_placeholder"}}</label>
        <input id="volo-reader-ident" class="volo-input" name="ident" required autocomplete="username" placeholder="{{t .Locale "reader.ident_placeholder"}}">
      </div>
      <div class="reader-auth-field">
        <label class="reader-auth-label" for="volo-reader-pwd">{{t .Locale "reader.password_placeholder"}}</label>
        <input id="volo-reader-pwd" class="volo-input" name="password" type="password" required autocomplete="current-password" placeholder="{{t .Locale "reader.password_placeholder"}}">
      </div>
      <div class="js-auth-msg reader-auth-msg reader-auth-msg--error"></div>
      <button class="volo-btn" type="submit">{{t .Locale "nav.login"}}</button>
    </form>
  </section>

  {{if .Reading.AllowReaderRegister}}
    <section class="studio-article reader-auth-card">
      <h2 class="reader-auth-card__title">{{t .Locale "reader.register_tab"}}</h2>
      <form id="volo-reader-reg-form" class="reader-auth-form" autocomplete="off">
        <div class="reader-auth-field">
          <label class="reader-auth-label" for="volo-reg-username">{{t .Locale "reader.username_placeholder"}}</label>
          <input id="volo-reg-username" class="volo-input" name="username" required minlength="2" maxlength="48" autocomplete="off" placeholder="{{t .Locale "reader.username_placeholder"}}">
        </div>
        <div class="reader-auth-field">
          <label class="reader-auth-label" for="volo-reg-email">{{t .Locale "reader.email_placeholder"}}</label>
          <div class="reader-auth-code-row">
            <input id="volo-reg-email" class="volo-input reader-auth-code-row__input" name="email" type="email" required autocomplete="email" placeholder="{{t .Locale "reader.email_placeholder"}}">
            <button id="volo-send-code-btn" class="studio-icon-btn reader-auth-code-row__btn" type="button">{{t .Locale "reader.send_code"}}</button>
          </div>
        </div>
        <div class="reader-auth-field">
          <label class="reader-auth-label" for="volo-reg-code">{{t .Locale "reader.code_placeholder"}}</label>
          <input id="volo-reg-code" class="volo-input" name="code" required maxlength="6" autocomplete="one-time-code" placeholder="{{t .Locale "reader.code_placeholder"}}">
        </div>
        <div class="reader-auth-field">
          <label class="reader-auth-label" for="volo-reg-pwd">{{t .Locale "reader.new_password_placeholder"}}</label>
          <input id="volo-reg-pwd" class="volo-input" name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="{{t .Locale "reader.new_password_placeholder"}}">
        </div>
        <div class="js-auth-msg reader-auth-msg reader-auth-msg--info"></div>
        <button class="volo-btn" type="submit">{{t .Locale "reader.register_tab"}}</button>
      </form>
    </section>
  {{end}}
</div>
{{end}}
