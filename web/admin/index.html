<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Volo Studio Console</title>
  <!--VOLO_BOOT-->
  <style>
    :root { background: #f6f7f3; color: #19211f; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not(:has(> head > meta[name="color-scheme"][content="light"])) { background: #1b2021; color: #e7ecea; }
    }
    html[data-theme="dark"], :root:has(> head > meta[name="color-scheme"][content="dark"]) { background: #1b2021; color: #e7ecea; }
    :root:has(> head > meta[name="color-scheme"][content="dark"]) { color-scheme: dark; }
    :root:has(> head > meta[name="color-scheme"][content="light"]) { color-scheme: light; }
  </style>
  <meta name="color-scheme" content="light dark" />
  <script>
    (function () {
      var cfg = {};
      try {
        var el = document.getElementById("volo-boot-config");
        if (el && el.textContent) cfg = JSON.parse(el.textContent) || {};
      } catch (_) {}
      var m = "";
      try {
        m = localStorage.getItem("volo_theme_mode") || localStorage.getItem("volo_console_theme") || "";
      } catch (_) {}
      if (!m) m = cfg.default_theme || "auto";
      var eff = m;
      if (m === "system") {
        eff = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } else if (m !== "light" && m !== "dark") {
        var d = new Date();
        var mins = d.getHours() * 60 + d.getMinutes();
        var dark = !(mins >= 390 && mins < 1140);
        eff = dark ? "dark" : "light";
      }
      var root = document.documentElement;
      root.setAttribute("data-mode", m);
      root.setAttribute("data-theme", eff);
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.content = m === "system" ? "light dark" : eff;
      if (cfg.accent) root.setAttribute("data-accent", cfg.accent);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
